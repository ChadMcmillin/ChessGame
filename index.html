<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Edge">
  <title>Gridiron Edge</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="top">
    <h1><span class="mark">◆</span> Gridiron Edge</h1>
    <div id="status" class="status">Connecting…</div>
  </header>
  <main id="view"></main>
  <nav id="tabs">
    <button data-tab="picks" class="on"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>Best Bets</button>
    <button data-tab="games"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="5.5" transform="rotate(-35 12 12)"/><path d="m9.5 14.5 5-5"/></svg>Games<b id="badge-live" class="badge live-b"></b></button>
    <button data-tab="bets"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>My Bets<b id="badge-bets" class="badge"></b></button>
  </nav>
  <section id="sheet" aria-live="polite"></section>
  <button id="toast" data-act="toast"></button>
  <div id="pricer" class="modal">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="pr-label">
      <div class="title" id="pr-label"></div>
      <p class="sub" id="pr-sub"></p>
      <div class="pr-row">
        <button type="button" id="pr-sign" aria-label="Switch between minus and plus">−</button>
        <input id="pr-val" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="224" aria-label="DraftKings price">
      </div>
      <p id="pr-out" class="pr-out"></p>
      <div class="actions"><button class="btn" id="pr-save">Save price</button></div>
      <div class="actions"><button class="btn ghost" id="pr-clear">Remove price</button><button class="btn ghost" id="pr-cancel">Cancel</button></div>
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
